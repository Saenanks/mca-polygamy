name: Build MCA 7.7.1-beta.5 with multiple spouses

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Get the polygamy patch from this repository
        uses: actions/checkout@v4
        with:
          path: addon

      - name: Get the MCA 7.7.1-beta.5 (1.20.1) source code
        uses: actions/checkout@v4
        with:
          repository: Luke100000/minecraft-comes-alive
          ref: f9e8f01892368b46c4e5d66578d7d88b2c568d96
          path: mca
          fetch-depth: 0
          fetch-tags: true

      - name: Apply the polygamy changes
        working-directory: mca
        run: git apply --verbose ../addon/polygamy-7.7.1-beta.5.patch

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: |
            17
            21

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build the Forge jar
        working-directory: mca
        run: ./gradlew :forge:build --console=plain --non-interactive

      - name: Collect the finished jar
        run: |
          mkdir dist
          ls -l mca/forge/build/libs/
          cp mca/forge/build/libs/*.jar dist/
          rm -f dist/*dev* dist/*sources*
          ls -l dist

      - name: Upload the jar
        uses: actions/upload-artifact@v4
        with:
          name: mca-multiple-spouses-forge-1.20.1-7.7.1-beta.5
          path: dist/*.jar
          if-no-files-found: error
